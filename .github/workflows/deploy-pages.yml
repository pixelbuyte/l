name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          node test/run.js
          node day/test/run.js
          node heart/test/run.js
          node crown/test/run.js
          node body/test/run.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html humanize.html css js data _site/
          cp -r day heart crown body _site/
          rm -rf _site/day/test _site/heart/test _site/crown/test _site/body/test _site/heart/tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
